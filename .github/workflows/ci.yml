name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore GameSync.sln

      - name: Build Debug
        run: dotnet build GameSync.sln -c Debug -p:Platform=x64 --no-restore

      - name: Build Release
        run: dotnet build GameSync.sln -c Release -p:Platform=x64 --no-restore

      - name: Test Release
        run: >
          dotnet test GameSync.sln
          -c Release
          -p:Platform=x64
          --no-build
          --verbosity normal
          --logger "trx;LogFilePrefix=test-results"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            TestResults/**
          if-no-files-found: ignore
          retention-days: 14
